<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="theme-color" content="#121018">
		<title>Don't Pick at the Scabs: Arcade</title>
		<style>
/* DPATS Arcade landing page. Shows instantly while the game downloads;
   PLAY starts the game (and unlocks sound) once it is ready.
   Streaming links are injected at build time from config/promo_links.json. */
html, body {
	margin: 0;
	padding: 0;
	height: 100%;
	background: #121018;
	color: #f4f1e8;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	position: fixed;
	inset: 0;
	border: 0;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#dpats-landing {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	/* safe: never push content off the top on short screens; scroll instead */
	justify-content: safe center;
	overflow-y: auto;
	gap: 18px;
	padding: 24px 20px;
	box-sizing: border-box;
	background: radial-gradient(circle at 50% 30%, #2a1420 0%, #121018 70%);
	text-align: center;
	touch-action: pan-y;
}

.info {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 18px;
}

/* Phone held sideways (short screen): art beside the text, tighter spacing. */
@media (orientation: landscape) and (max-height: 520px) {
	#dpats-landing {
		flex-direction: row;
		gap: 28px;
		padding: 12px 20px;
	}
	.art {
		width: min(72vh, 38vw);
		height: min(72vh, 38vw);
		flex-shrink: 0;
	}
	.info {
		gap: 8px;
	}
	h1 {
		font-size: clamp(18px, 6vh, 30px);
	}
	#play {
		min-height: 52px;
		font-size: 22px;
	}
}

#page-links {
	display: none;
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 20;
	padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
	background: rgba(18, 16, 24, 0.94);
	border-top: 3px solid #d8262c;
	text-align: center;
}

#page-links .stream-label {
	margin: 0 0 8px;
}

#dpats-landing.gone {
	display: none;
}

.art {
	width: min(62vw, 34vh, 320px);
	height: min(62vw, 34vh, 320px);
	border: 4px solid #000;
	border-radius: 14px;
	box-shadow: 0 0 0 3px #d8262c, 0 16px 40px rgba(0, 0, 0, 0.6);
}

h1 {
	margin: 0;
	font-size: clamp(22px, 6.5vw, 38px);
	line-height: 1.05;
	font-weight: 900;
	letter-spacing: 0.02em;
	text-transform: uppercase;
}

h1 small {
	display: block;
	color: #ffe14d;
	font-size: 0.55em;
	letter-spacing: 0.3em;
	margin-top: 6px;
}

.stream-label {
	margin: 0;
	color: #ffe14d;
	font-size: 13px;
	font-weight: 800;
	letter-spacing: 0.2em;
}

.links {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: 10px;
	max-width: 520px;
}

.links a {
	display: inline-block;
	min-height: 44px;
	line-height: 44px;
	padding: 0 18px;
	border: 3px solid #000;
	border-radius: 12px;
	background: #f4f1e8;
	color: #000;
	font-weight: 800;
	font-size: 15px;
	text-decoration: none;
}

#play {
	min-width: 240px;
	min-height: 64px;
	border: 4px solid #000;
	border-radius: 16px;
	background: #e8c547;
	color: #000;
	font-size: 26px;
	font-weight: 900;
	letter-spacing: 0.08em;
	cursor: pointer;
}

#play:disabled {
	background: #4a4652;
	color: #c9c4d4;
	cursor: wait;
}

#progress {
	width: min(70vw, 320px);
	height: 8px;
	border-radius: 4px;
	background: #2c2834;
	overflow: hidden;
}

#progress > div {
	width: 0%;
	height: 100%;
	background: #d8262c;
	transition: width 0.2s;
}

#in-app-hint {
	display: none;
	max-width: 420px;
	padding: 10px 14px;
	border-radius: 10px;
	background: #2c2834;
	color: #c9c4d4;
	font-size: 13px;
}

#in-app-hint button {
	margin-left: 8px;
	border: 0;
	background: none;
	color: #ffe14d;
	font-weight: 800;
	font-size: 13px;
}

#error {
	display: none;
	max-width: 420px;
	color: #ff8a8a;
	font-size: 14px;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="dpats-landing">
			<img class="art" src="landing_art_placeholder.svg" alt="Don't Pick at the Scabs album art">
			<div class="info">
				<h1>Don't Pick at the Scabs<small>Arcade</small></h1>
				<p class="stream-label">STREAM THE ALBUM</p>
				<div class="links" id="links"><a href="https://example.com/spotify-placeholder" target="_blank" rel="noopener">SPOTIFY</a><a href="https://example.com/apple-music-placeholder" target="_blank" rel="noopener">APPLE MUSIC</a><a href="https://example.com/youtube-placeholder" target="_blank" rel="noopener">YOUTUBE</a></div>
				<div id="progress"><div></div></div>
				<button id="play" disabled>LOADING…</button>
				<div id="in-app-hint">For the best experience, open in Safari or Chrome.<button id="hint-close" aria-label="Dismiss">OK</button></div>
				<div id="error"></div>
			</div>
		</div>

		<!-- Shown over the game on the pause and game-over screens: real links,
		     so phones treat a tap as a tap (links opened from inside the game
		     get blocked on iPhones). The game toggles it via dpatsPageLinks(). -->
		<div id="page-links">
			<p class="stream-label">STREAM THE ALBUM</p>
			<div class="links"><a href="https://example.com/spotify-placeholder" target="_blank" rel="noopener">SPOTIFY</a><a href="https://example.com/apple-music-placeholder" target="_blank" rel="noopener">APPLE MUSIC</a><a href="https://example.com/youtube-placeholder" target="_blank" rel="noopener">YOUTUBE</a></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":199732,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

(function () {
	const landing = document.getElementById('dpats-landing');
	const play = document.getElementById('play');
	const bar = document.querySelector('#progress > div');
	const errorBox = document.getElementById('error');

	// Inside Instagram, TikTok, Facebook, X, Snapchat or LinkedIn's own browser.
	const inApp = /Instagram|FBAN|FBAV|TikTok|musical_ly|Twitter|Snapchat|LinkedInApp/i.test(navigator.userAgent);
	if (inApp) {
		const hint = document.getElementById('in-app-hint');
		hint.style.display = 'block';
		document.getElementById('hint-close').addEventListener('click', () => { hint.style.display = 'none'; });
	}

	function fail(err) {
		console.error(err);
		errorBox.textContent = (err && err.message) ? err.message : String(err);
		errorBox.style.display = 'block';
		play.textContent = 'UNAVAILABLE';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features the game needs: ' + missing.join(', '));
		return;
	}

	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		onProgress: function (current, total) {
			// Late progress events must not relabel PLAY once it is ready.
			if (current > 0 && total > 0 && play.disabled && !landing.classList.contains('gone')) {
				const percent = Math.min(100, Math.round(current / total * 100));
				bar.style.width = percent + '%';
				play.textContent = 'LOADING… ' + percent + '%';
			}
		},
	}));

	// Download the engine and the game behind the landing page.
	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || (exe + '.pck');
	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(() => {
		bar.style.width = '100%';
		play.disabled = false;
		play.textContent = 'PLAY';
	}, fail);

	// The game calls this to show or hide the real album links over it.
	window.dpatsPageLinks = function (show) {
		document.getElementById('page-links').style.display = show ? 'block' : 'none';
	};

	// PLAY: start inside the tap, which is what lets the browser play sound.
	play.addEventListener('click', () => {
		if (play.disabled) {
			return;
		}
		// iPhones mute web audio on the silent switch unless the page says
		// it plays media (Safari 16.4+; ignored elsewhere).
		if (navigator.audioSession) {
			try {
				navigator.audioSession.type = 'playback';
			} catch (e) {
				// Not supported: sound still plays when the ringer is on.
			}
		}
		play.disabled = true;
		landing.classList.add('gone');
		engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG.args || []) }).then(() => {
			document.getElementById('canvas').focus();
		}, fail);
	});
}());
		</script>
	</body>
</html>
